name: lammah
description: "تطبيق ألعاب جماعية عربي للجلسات - لمّة"
publish_to: 'none'
version: 1.0.0+10

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & DI
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # UI, Fonts & Animation
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.10+1
  smooth_page_indicator: ^1.1.0

  # Storage & Offline Cache
  shared_preferences: ^2.2.3

  # Audio & Feedback
  audioplayers: ^6.0.0

  # Networking & Realtime WebSockets
  http: ^1.2.2
  url_launcher: ^6.3.0
  intl: ^0.19.0
  uuid: ^4.4.0
  pusher_channels_flutter: ^2.2.1
  web_socket_channel: ^3.0.1
  image_picker: ^1.1.2
  dio: ^5.11.1
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^7.0.1
  flutter_facebook_auth: ^7.1.6
  flutter_web_auth_2: ^5.1.0
  crypto: ^3.0.8
  flutter_secure_storage: ^10.3.4
  video_player: ^2.9.5
  livekit_client: ^2.3.6
  qr_flutter: ^4.1.0
  app_links: ^6.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  path_provider_android: 2.2.15

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
    - assets/audio/
    - assets/fonts/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
