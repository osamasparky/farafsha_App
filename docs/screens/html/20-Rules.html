  <section role="dialog" aria-modal="true" aria-labelledby="rules-t" style="position: absolute; left: 0; right: 0; bottom: 0; height: 660px; border-radius: 32px 32px 0 0; background: linear-gradient(180deg, #2E1866 0%, #1B0D3C 100%); border-top: 2px solid #B98AFF; box-shadow: 0 -10px 40px rgba(163,91,255,0.35); padding: 12px 22px 30px; display: flex; flex-direction: column; gap: 14px">
    <span aria-hidden="true" style="align-self: center; width: 48px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.3)"></span>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 id="rules-t" style="margin: 0; font-size: 22px; font-weight: 900">إزاي نلعب أمثال شعبية؟</h1>
      <a href="Game.dc.html" aria-label="إغلاق" style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.08); color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </div>

    <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px">
      <li style="display: flex; gap: 14px; align-items: center; padding: 12px; border-radius: 18px; background: rgba(255,255,255,0.05); border: 1px solid rgba(163,91,255,0.25)">
        <span style="width: 54px; height: 54px; flex: none; border-radius: 16px; background: linear-gradient(160deg,#D2566A,#8E2A4E); display: flex; align-items: center; justify-content: center; position: relative"><img src="../../assets/ic-quote.png" alt="" style="width: 44px; height: 40px; object-fit: contain; -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%); mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%)"><span style="position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; background: #FFC24B; color: #2A0E35; font-size: 12px; font-weight: 900; display: flex; align-items: center; justify-content: center">1</span></span>
        <span style="display: flex; flex-direction: column; line-height: 1.45"><span style="font-size: 16px; font-weight: 900">أول المثل بيظهر</span><span style="font-size: 13px; color: #CFC6E4">اللاعب يقراه بصوت عالي للكل</span></span>
      </li>
      <li style="display: flex; gap: 14px; align-items: center; padding: 12px; border-radius: 18px; background: rgba(255,255,255,0.05); border: 1px solid rgba(163,91,255,0.25)">
        <span style="width: 54px; height: 54px; flex: none; border-radius: 16px; background: linear-gradient(160deg,#4846BE,#2B2580); display: flex; align-items: center; justify-content: center; position: relative"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFC24B" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2M9 2h6"></path></svg><span style="position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; background: #FFC24B; color: #2A0E35; font-size: 12px; font-weight: 900; display: flex; align-items: center; justify-content: center">2</span></span>
        <span style="display: flex; flex-direction: column; line-height: 1.45"><span style="font-size: 16px; font-weight: 900">كمّلوه في 20 ثانية</span><span style="font-size: 13px; color: #CFC6E4">اختاروا التكملة الصح أو قولوها</span></span>
      </li>
      <li style="display: flex; gap: 14px; align-items: center; padding: 12px; border-radius: 18px; background: rgba(255,255,255,0.05); border: 1px solid rgba(163,91,255,0.25)">
        <span style="width: 54px; height: 54px; flex: none; border-radius: 16px; background: linear-gradient(160deg,#2F6E7A,#1B3F52); display: flex; align-items: center; justify-content: center; position: relative"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="#FFC24B"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.2 1.3-6.6L2.5 9.3l6.6-.8z"></path></svg><span style="position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; background: #FFC24B; color: #2A0E35; font-size: 12px; font-weight: 900; display: flex; align-items: center; justify-content: center">3</span></span>

    <h2 style="margin: 4px 0 0; font-size: 15px; font-weight: 900; color: #C9A2FF">حساب النقط</h2>

  </section>

</template>
<script>window.__props={};
class DCLogic{constructor(p){this.props=p||{};this.state={};}setState(s){Object.assign(this.state,typeof s==='function'?s(this.state):s);}forceUpdate(){}}

class Component extends DCLogic {
renderVals() {
return {};
}
}


function look(scope,p){p=p.trim(); if(p==='true')return true; if(p==='false')return false; if(/^-?\d+(\.\d+)?$/.test(p))return +p; return p.split('.').reduce((o,k)=>o==null?undefined:o[k],scope);}
function sub(str,scope){return str.replace(/\{\{\s*([^}]+?)\s*\}\}/g,(m,p)=>{const v=look(scope,p);return v==null?'':String(v);});}
function proc(node,scope){
  for(const ch of Array.from(node.childNodes)){
    if(ch.nodeType===3){ if(ch.nodeValue.includes('{{')) ch.nodeValue=sub(ch.nodeValue,scope); continue; }
    if(ch.nodeType!==1) continue;
    const tag=ch.tagName.toLowerCase();
    if(tag==='sc-for'){ const m=(ch.getAttribute('list')||'').match(/\{\{\s*([^}]+?)\s*\}\}/); const list=m?look(scope,m[1])||[]:[]; const as=ch.getAttribute('as')||'item';
      list.forEach((it,i)=>{ const frag=document.createElement('div'); frag.innerHTML=ch.innerHTML; const s=Object.assign({},scope,{[as]:it,$index:i}); proc(frag,s); while(frag.firstChild) ch.parentNode.insertBefore(frag.firstChild,ch); });
      ch.remove(); continue; }
    if(tag==='sc-if'){ const m=(ch.getAttribute('value')||'').match(/\{\{\s*([^}]+?)\s*\}\}/); const v=m?look(scope,m[1]):false; if(v){ proc(ch,scope); while(ch.firstChild) ch.parentNode.insertBefore(ch.firstChild,ch);} ch.remove(); continue; }
    for(const a of Array.from(ch.attributes)){ if(/^on[A-Z]/.test(a.name)||/^on/.test(a.name)&&a.value.includes('{{')){ch.removeAttribute(a.name);continue;} if(a.value.includes('{{')) ch.setAttribute(a.name,sub(a.value,scope)); }
    proc(ch,scope);
  }
}
const tpl=document.getElementById('tpl'); const root=document.getElementById('root'); root.innerHTML=tpl.innerHTML;
const comp=new Component(window.__props||{}); proc(root,comp.renderVals()||{});
</script>
