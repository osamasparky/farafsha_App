<head>

<style>
body{margin:0;font-family:'Cairo',sans-serif;color:#FFFFFF}

</head>
<body>
<div id="root"></div>
<template id="tpl">

<div dir="rtl" style="width: 390px; height: 844px; background: radial-gradient(100% 45% at 50% 20%, #4A2290 0%, #241050 55%, #150A2E 100%); display: flex; flex-direction: column; overflow: hidden; font-family: 'Cairo', sans-serif; color: #FFFFFF; padding: 20px 20px 32px; gap: 16px">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Game.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 22px; font-weight: 900">مين بيلعب؟</h1>
    <button aria-label="توزيع عشوائي" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid rgba(163,91,255,0.4); background: rgba(255,255,255,0.06); color: #FFC24B; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"></path></svg>
    </button>
  </div>

  <div role="group" aria-label="نمط اللعب" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: rgba(0,0,0,0.25); border: 1px solid rgba(163,91,255,0.3)">
    <button aria-pressed="true" style="height: 42px; border-radius: 999px; border: none; background: linear-gradient(180deg, #A35BFF, #7A2FE0); color: #FFFFFF; font-size: 15px; font-weight: 800; box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 0 16px rgba(163,91,255,0.55)">فرق</button>
    <button aria-pressed="false" style="height: 42px; border-radius: 999px; border: none; background: transparent; color: #CFC6E4; font-size: 15px; font-weight: 700">فردي بالتناوب</button>
  </div>

  <section style="border-radius: 20px; padding: 14px; background: linear-gradient(160deg, rgba(143,59,208,0.45), rgba(74,30,154,0.35)); border: 1.5px solid #B98AFF; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h2 style="margin: 0; font-size: 17px; font-weight: 900; display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 4px; background: #B98AFF"></span>فريق البنفسج</h2>
      <span style="font-size: 13px; color: #EADFFF; font-weight: 700">3 لاعبين</span>
    </div>
    <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px">
      <li style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 4px 0 10px; border-radius: 999px; background: rgba(0,0,0,0.25)"><img src="../../assets/av-ahmed.png" alt="" style="width: 34px; height: 34px; border-radius: 50%; object-fit: cover"><span style="font-size: 14px; font-weight: 800">أحمد</span><button aria-label="شيل أحمد" style="width: 28px; height: 28px; border: none; background: transparent; color: #CFC6E4; font-size: 18px">×</button></li>
      <li style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 4px 0 10px; border-radius: 999px; background: rgba(0,0,0,0.25)"><img src="../../assets/av-sara.png" alt="" style="width: 34px; height: 34px; border-radius: 50%; object-fit: cover"><span style="font-size: 14px; font-weight: 800">سارة</span><button aria-label="شيل سارة" style="width: 28px; height: 28px; border: none; background: transparent; color: #CFC6E4; font-size: 18px">×</button></li>
      <li style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 4px 0 10px; border-radius: 999px; background: rgba(0,0,0,0.25)"><img src="../../assets/av-karim.png" alt="" style="width: 34px; height: 34px; border-radius: 50%; object-fit: cover"><span style="font-size: 14px; font-weight: 800">كريم</span><button aria-label="شيل كريم" style="width: 28px; height: 28px; border: none; background: transparent; color: #CFC6E4; font-size: 18px">×</button></li>
    </ul>
  </section>

  <section style="border-radius: 20px; padding: 14px; background: linear-gradient(160deg, rgba(255,138,76,0.35), rgba(242,86,154,0.25)); border: 1.5px solid #FF9E6A; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h2 style="margin: 0; font-size: 17px; font-weight: 900; display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 4px; background: #FF9E6A"></span>فريق البرتقان</h2>
      <span style="font-size: 13px; color: #FFE3D2; font-weight: 700">2 لاعبين</span>
    </div>
    <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px">
      <li style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 4px 0 10px; border-radius: 999px; background: rgba(0,0,0,0.25)"><img src="../../assets/av-mena.png" alt="" style="width: 34px; height: 34px; border-radius: 50%; object-fit: cover"><span style="font-size: 14px; font-weight: 800">منة</span><button aria-label="شيل منة" style="width: 28px; height: 28px; border: none; background: transparent; color: #FFE3D2; font-size: 18px">×</button></li>
      <li style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 4px 0 10px; border-radius: 999px; background: rgba(0,0,0,0.25)"><img src="../../assets/av-mahmoud.png" alt="" style="width: 34px; height: 34px; border-radius: 50%; object-fit: cover"><span style="font-size: 14px; font-weight: 800">محمود</span><button aria-label="شيل محمود" style="width: 28px; height: 28px; border: none; background: transparent; color: #FFE3D2; font-size: 18px">×</button></li>
    </ul>
  </section>

  <div style="display: flex; gap: 10px">
    <label for="newp" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">اسم لاعب جديد</label>
    <input id="newp" placeholder="اسم لاعب جديد" style="flex: 1; min-width: 0; height: 54px; padding: 0 16px; border-radius: 16px; border: 1.5px solid rgba(163,91,255,0.45); background: rgba(0,0,0,0.25); color: #FFFFFF; font-size: 16px; font-weight: 700; outline: none">
    <button style="height: 54px; padding: 0 18px; border-radius: 16px; border: none; border-bottom: 4px solid #4A1690; background: linear-gradient(180deg, #B98AFF, #7A2FE0); color: #FFFFFF; font-size: 16px; font-weight: 900; box-shadow: inset 0 1px 0 rgba(255,255,255,0.4)">+ إضافة</button>
  </div>
  <p style="margin: -6px 0 0; font-size: 13px; color: #A99BC8">من 4 لـ 12 لاعب. الاسم بيتحفظ على الجهاز بس.</p>

  <div style="flex: 1"></div>
  <a href="Play.dc.html" style="text-decoration: none; height: 62px; border-radius: 999px; background: linear-gradient(90deg, #FFB25E 0%, #FF8A4C 45%, #F2569A 100%); border-bottom: 5px solid #B83A72; color: #2A0E35; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 22px; font-weight: 900; box-shadow: inset 0 2px 0 rgba(255,255,255,0.55), 0 12px 30px rgba(242,86,154,0.45)">
    ابدأ الجولة
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17 4.5v15L5 12z"></path></svg>
  </a>
</div>
</template>
<script>window.__props={};
class DCLogic{constructor(p){this.props=p||{};this.state={};}setState(s){Object.assign(this.state,typeof s==='function'?s(this.state):s);}forceUpdate(){}}

class Component extends DCLogic {
renderVals() {
return {};
}
}


function look(scope,p){p=p.trim(); if(p==='true')return true; if(p==='false')return false; if(/^-?\d+(\.\d+)?$/.test(p))return +p; return p.split('.').reduce((o,k)=>o==null?undefined:o[k],scope);}
function sub(str,scope){return str.replace(/\{\{\s*([^}]+?)\s*\}\}/g,(m,p)=>{const v=look(scope,p);return v==null?'':String(v);});}
function proc(node,scope){
  for(const ch of Array.from(node.childNodes)){
    if(ch.nodeType===3){ if(ch.nodeValue.includes('{{')) ch.nodeValue=sub(ch.nodeValue,scope); continue; }
    if(ch.nodeType!==1) continue;
    const tag=ch.tagName.toLowerCase();
    if(tag==='sc-for'){ const m=(ch.getAttribute('list')||'').match(/\{\{\s*([^}]+?)\s*\}\}/); const list=m?look(scope,m[1])||[]:[]; const as=ch.getAttribute('as')||'item';
      list.forEach((it,i)=>{ const frag=document.createElement('div'); frag.innerHTML=ch.innerHTML; const s=Object.assign({},scope,{[as]:it,$index:i}); proc(frag,s); while(frag.firstChild) ch.parentNode.insertBefore(frag.firstChild,ch); });
      ch.remove(); continue; }
    if(tag==='sc-if'){ const m=(ch.getAttribute('value')||'').match(/\{\{\s*([^}]+?)\s*\}\}/); const v=m?look(scope,m[1]):false; if(v){ proc(ch,scope); while(ch.firstChild) ch.parentNode.insertBefore(ch.firstChild,ch);} ch.remove(); continue; }
    for(const a of Array.from(ch.attributes)){ if(/^on[A-Z]/.test(a.name)||/^on/.test(a.name)&&a.value.includes('{{')){ch.removeAttribute(a.name);continue;} if(a.value.includes('{{')) ch.setAttribute(a.name,sub(a.value,scope)); }
    proc(ch,scope);
  }
}
const tpl=document.getElementById('tpl'); const root=document.getElementById('root'); root.innerHTML=tpl.innerHTML;
const comp=new Component(window.__props||{}); proc(root,comp.renderVals()||{});
</script>
</body>
</html>
