<!doctype html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="../../fonts/fonts.css">


<style>
body{margin:0;font-family:'Cairo',sans-serif;color:#FFFFFF}
*{box-sizing:border-box}
button,input{font-family:inherit}
a{color:#FFD27A}a:hover{color:#FFFFFF}
</style>

<style>html,body{background:#0B0618}</style>
</head>
<body>
<div id="root"></div>
<template id="tpl">

<div dir="rtl" style="width: 390px; height: 844px; background: radial-gradient(90% 40% at 50% 28%, #5E1F7A 0%, #2A0F4A 55%, #12071F 100%); display: flex; flex-direction: column; overflow: hidden; position: relative; font-family: 'Cairo', sans-serif; color: #FFFFFF; padding: 20px 20px 30px; gap: 14px">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Pause.dc.html" aria-label="إيقاف مؤقت" style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.08); color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
    </a>
    <span style="font-size: 14px; font-weight: 800; padding: 6px 14px; border-radius: 999px; background: rgba(255,255,255,0.08)">الجولة 5 من 10</span>
    <span role="timer" aria-label="متبقي 15 ثانية" style="height: 40px; padding: 0 14px; border-radius: 999px; background: linear-gradient(90deg, #8138E8, #A35BFF); display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 900; box-shadow: 0 0 14px rgba(163,91,255,0.5)">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFC24B" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2M9 2h6"></path></svg>00:15
    </span>
  </div>

  <h1 style="margin: 4px 0 0; font-size: 22px; font-weight: 900; text-align: center">كمّل الجملة المشهورة</h1>

  <section style="position: relative; border-radius: 22px; padding: 14px; background: #1A0B2C; border: 3px solid #FFC24B; box-shadow: 0 0 30px rgba(255,194,75,0.35), inset 0 0 30px rgba(0,0,0,0.6)">
    <div aria-hidden="true" style="position: absolute; top: -3px; left: 18px; right: 18px; height: 6px; background: repeating-linear-gradient(90deg, #FFF1C7 0 6px, transparent 6px 18px); border-radius: 3px; filter: drop-shadow(0 0 4px #FFC24B)"></div>
    <div aria-hidden="true" style="position: absolute; bottom: -3px; left: 18px; right: 18px; height: 6px; background: repeating-linear-gradient(90deg, #FFF1C7 0 6px, transparent 6px 18px); border-radius: 3px; filter: drop-shadow(0 0 4px #FFC24B)"></div>
    <div style="border-radius: 14px; padding: 24px 16px; background: radial-gradient(120% 100% at 50% 0%, #3E2380, #1F0F42); text-align: center; display: flex; flex-direction: column; gap: 10px">
      <span style="align-self: center; font-size: 12px; font-weight: 800; color: #2A0E35; background: #FFC24B; padding: 2px 12px; border-radius: 999px">فيلم كوميدي · التسعينات</span>
      <p style="margin: 0; font-size: 28px; font-weight: 900; line-height: 1.5">«إنت فاكرني مين؟<br>أنا …»</p>
    </div>
  </section>

  <div role="radiogroup" aria-label="الإجابات" style="display: flex; flex-direction: column; gap: 10px">
    <button role="radio" aria-checked="true" style="height: 56px; border-radius: 16px; padding: 0 14px; border: 2px solid #C9A2FF; background: linear-gradient(90deg, #6A24C9, #8138E8); color: #FFFFFF; display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 800; box-shadow: 0 0 18px rgba(163,91,255,0.55)">
      <span style="flex: 1; text-align: center">اللي ما بيتنسيش</span>
      <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 50%; background: #35B88E; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
    </button>
    <button role="radio" aria-checked="false" style="height: 56px; border-radius: 16px; padding: 0 14px; border: 1.5px solid rgba(163,91,255,0.35); background: #2A1850; color: #FFFFFF; font-size: 18px; font-weight: 700">ابن البلد الجدع</button>
    <button role="radio" aria-checked="false" style="height: 56px; border-radius: 16px; padding: 0 14px; border: 1.5px solid rgba(163,91,255,0.35); background: #2A1850; color: #FFFFFF; font-size: 18px; font-weight: 700">صاحب الحق</button>
  </div>

  <img src="../../assets/popcorn.png" alt="" style="position: absolute; bottom: 92px; left: -10px; width: 130px; height: 108px; object-fit: cover; opacity: 0.9; -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 55%, transparent 100%); mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 55%, transparent 100%)">

  <div style="flex: 1"></div>
  <a href="Results.dc.html" style="text-decoration: none; height: 60px; border-radius: 999px; background: linear-gradient(180deg, #B98AFF, #7A2FE0); border-bottom: 5px solid #4A1690; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 21px; font-weight: 900; box-shadow: inset 0 2px 0 rgba(255,255,255,0.45), 0 0 28px rgba(163,91,255,0.55); position: relative">
    التالي
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 6l-6 6 6 6M19 6l-6 6 6 6"></path></svg>
  </a>
</div>
</template>
<script>window.__props={};
class DCLogic{constructor(p){this.props=p||{};this.state={};}setState(s){Object.assign(this.state,typeof s==='function'?s(this.state):s);}forceUpdate(){}}

class Component extends DCLogic {
renderVals() {
return {};
}
}


function look(scope,p){p=p.trim(); if(p==='true')return true; if(p==='false')return false; if(/^-?\d+(\.\d+)?$/.test(p))return +p; return p.split('.').reduce((o,k)=>o==null?undefined:o[k],scope);}
function sub(str,scope){return str.replace(/\{\{\s*([^}]+?)\s*\}\}/g,(m,p)=>{const v=look(scope,p);return v==null?'':String(v);});}
function proc(node,scope){
  for(const ch of Array.from(node.childNodes)){
    if(ch.nodeType===3){ if(ch.nodeValue.includes('{{')) ch.nodeValue=sub(ch.nodeValue,scope); continue; }
    if(ch.nodeType!==1) continue;
    const tag=ch.tagName.toLowerCase();
    if(tag==='sc-for'){ const m=(ch.getAttribute('list')||'').match(/\{\{\s*([^}]+?)\s*\}\}/); const list=m?look(scope,m[1])||[]:[]; const as=ch.getAttribute('as')||'item';
      list.forEach((it,i)=>{ const frag=document.createElement('div'); frag.innerHTML=ch.innerHTML; const s=Object.assign({},scope,{[as]:it,$index:i}); proc(frag,s); while(frag.firstChild) ch.parentNode.insertBefore(frag.firstChild,ch); });
      ch.remove(); continue; }
    if(tag==='sc-if'){ const m=(ch.getAttribute('value')||'').match(/\{\{\s*([^}]+?)\s*\}\}/); const v=m?look(scope,m[1]):false; if(v){ proc(ch,scope); while(ch.firstChild) ch.parentNode.insertBefore(ch.firstChild,ch);} ch.remove(); continue; }
    for(const a of Array.from(ch.attributes)){ if(/^on[A-Z]/.test(a.name)||/^on/.test(a.name)&&a.value.includes('{{')){ch.removeAttribute(a.name);continue;} if(a.value.includes('{{')) ch.setAttribute(a.name,sub(a.value,scope)); }
    proc(ch,scope);
  }
}
const tpl=document.getElementById('tpl'); const root=document.getElementById('root'); root.innerHTML=tpl.innerHTML;
const comp=new Component(window.__props||{}); proc(root,comp.renderVals()||{});
</script>
</body>
</html>
