<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لعبة الجماعة — شاشة اللعب</title>
<link rel="stylesheet" href="../../fonts/fonts.css">


<style>
body{margin:0;font-family:'Cairo',sans-serif;color:#FFFFFF}
*{box-sizing:border-box}
button,input{font-family:inherit}
a{color:#D9C2FF}a:hover{color:#FFFFFF}
</style>

<style>html,body{background:#0B0618}</style>
</head>
<body>
<div id="root"></div>
<template id="tpl">

<div dir="rtl" style="width: 390px; height: 844px; background: radial-gradient(100% 45% at 50% 35%, #4A2290 0%, #241050 55%, #150A2E 100%); display: flex; flex-direction: column; overflow: hidden; font-family: 'Cairo', sans-serif; color: #FFFFFF; padding: 20px 20px 32px; gap: 18px">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
    <button aria-label="إيقاف مؤقت" style="width: 44px; height: 44px; border-radius: 12px; border: none; background: rgba(255,255,255,0.08); color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
    </button>
    <span style="font-size: 14px; font-weight: 700; padding: 6px 14px; border-radius: 999px; background: rgba(255,255,255,0.08)">الجولة 3 من 10</span>
    <span role="timer" aria-label="متبقي {{seconds}} ثانية" style="display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 800; padding: 6px 14px; border-radius: 999px; background: linear-gradient(90deg, #8138E8, #A35BFF); box-shadow: 0 0 14px rgba(163,91,255,0.5)">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFC24B" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2M9 2h6"></path></svg>
      {{clock}}
    </span>
  </div>

  <ul aria-label="النقاط" style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
    <li style="display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative">
      <svg aria-label="المتصدر" role="img" width="22" height="16" viewBox="0 0 78 56" style="margin-bottom: -2px"><path d="M6 18l16 14L39 4l17 28 16-14-8 32H14z" fill="#FFC24B"></path></svg>
      <img src="../../assets/av-ahmed.png" alt="" style="width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 3px solid #FFC24B; box-shadow: 0 0 16px rgba(255,194,75,0.55)">
      <span style="font-size: 13px; font-weight: 700">أحمد</span>
      <span style="font-size: 13px; font-weight: 800; color: #FFC24B">20</span>
    </li>
    <li style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 14px">
      <img src="../../assets/av-sara.png" alt="" style="width: 52px; height: 52px; border-radius: 50%; object-fit: cover; border: 3px solid #B98AFF">
      <span style="font-size: 13px; font-weight: 700">سارة</span>
      <span style="font-size: 13px; font-weight: 800; color: #D9C2FF">15</span>
    </li>
    <li style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 14px">
      <img src="../../assets/av-mahmoud.png" alt="" style="width: 52px; height: 52px; border-radius: 50%; object-fit: cover; border: 3px solid #B98AFF">
      <span style="font-size: 13px; font-weight: 700">محمود</span>
      <span style="font-size: 13px; font-weight: 800; color: #D9C2FF">10</span>
    </li>
    <li style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 14px">
      <img src="../../assets/av-mena.png" alt="" style="width: 52px; height: 52px; border-radius: 50%; object-fit: cover; border: 3px solid #B98AFF">
      <span style="font-size: 13px; font-weight: 700">منة</span>
      <span style="font-size: 13px; font-weight: 800; color: #D9C2FF">10</span>
    </li>
  </ul>

  <section style="border-radius: 22px; background: #2A1850; border: 1.5px solid rgba(163,91,255,0.35); padding: 16px 16px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px">
    <h1 style="margin: 0; font-size: 20px; font-weight: 800">كمّل المثل الشعبي</h1>
    <div style="width: 100%; padding: 22px 16px; border-radius: 14px; background: linear-gradient(180deg, #F6E3B8 0%, #E8C98A 100%); border: 3px solid #B88746; box-shadow: inset 0 0 24px rgba(140,90,30,0.35); color: #3E2410; text-align: center; font-family: 'Reem Kufi', 'Cairo', sans-serif; font-size: 30px; font-weight: 700">اللي اختشوا …</div>
  </section>

  <div role="radiogroup" aria-label="الإجابات" style="display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{options}}" as="o" hint-placeholder-count="3">
      <button role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" style="{{o.style}}">
        <span style="flex: 1; text-align: center">{{o.label}}</span>
        <sc-if value="{{o.isPicked}}" hint-placeholder-val="{{false}}">
          <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 50%; background: #2E9D7B; display: flex; align-items: center; justify-content: center">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>
          </span>
        </sc-if>
      </button>
    </sc-for>
  </div>

  <div style="flex: 1"></div>
  <a href="Leaderboard.dc.html" style="text-decoration: none; height: 58px; border-radius: 999px; background: linear-gradient(180deg, #B98AFF, #7A2FE0); border-bottom: 5px solid #4A1690; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 21px; font-weight: 900; box-shadow: inset 0 2px 0 rgba(255,255,255,0.45), 0 0 28px rgba(163,91,255,0.55)">
    التالي
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 6l-6 6 6 6M19 6l-6 6 6 6"></path></svg>
  </a>
</div>
</template>
<script>window.__props={"seconds":20};
class DCLogic{constructor(p){this.props=p||{};this.state={};}setState(s){Object.assign(this.state,typeof s==='function'?s(this.state):s);}forceUpdate(){}}

class Component extends DCLogic {
constructor(p) { super(p); this.state = { picked: 0 }; }
renderVals() {
const s = this.props.seconds ?? 20;
const labels = ['ماتوا', 'هربوا', 'سكتوا'];
const base = 'height: 54px; border-radius: 14px; padding: 0 14px; display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; color: #FFFFFF; cursor: pointer; ';
return {
seconds: s,
clock: '00:' + String(s).padStart(2, '0'),
options: labels.map((l, i) => {
const on = this.state.picked === i;
return {
label: l, isPicked: on, checked: on ? 'true' : 'false',
pick: () => this.setState({ picked: i }),
style: base + (on ? 'background: linear-gradient(90deg, #6A24C9, #8138E8); border: 2px solid #C9A2FF; box-shadow: 0 0 18px rgba(163,91,255,0.55)' : 'background: #2A1850; border: 1.5px solid rgba(163,91,255,0.3)')
};
})
};
}
}


function look(scope,p){p=p.trim(); if(p==='true')return true; if(p==='false')return false; if(/^-?\d+(\.\d+)?$/.test(p))return +p; return p.split('.').reduce((o,k)=>o==null?undefined:o[k],scope);}
function sub(str,scope){return str.replace(/\{\{\s*([^}]+?)\s*\}\}/g,(m,p)=>{const v=look(scope,p);return v==null?'':String(v);});}
function proc(node,scope){
  for(const ch of Array.from(node.childNodes)){
    if(ch.nodeType===3){ if(ch.nodeValue.includes('{{')) ch.nodeValue=sub(ch.nodeValue,scope); continue; }
    if(ch.nodeType!==1) continue;
    const tag=ch.tagName.toLowerCase();
    if(tag==='sc-for'){ const m=(ch.getAttribute('list')||'').match(/\{\{\s*([^}]+?)\s*\}\}/); const list=m?look(scope,m[1])||[]:[]; const as=ch.getAttribute('as')||'item';
      list.forEach((it,i)=>{ const frag=document.createElement('div'); frag.innerHTML=ch.innerHTML; const s=Object.assign({},scope,{[as]:it,$index:i}); proc(frag,s); while(frag.firstChild) ch.parentNode.insertBefore(frag.firstChild,ch); });
      ch.remove(); continue; }
    if(tag==='sc-if'){ const m=(ch.getAttribute('value')||'').match(/\{\{\s*([^}]+?)\s*\}\}/); const v=m?look(scope,m[1]):false; if(v){ proc(ch,scope); while(ch.firstChild) ch.parentNode.insertBefore(ch.firstChild,ch);} ch.remove(); continue; }
    for(const a of Array.from(ch.attributes)){ if(/^on[A-Z]/.test(a.name)||/^on/.test(a.name)&&a.value.includes('{{')){ch.removeAttribute(a.name);continue;} if(a.value.includes('{{')) ch.setAttribute(a.name,sub(a.value,scope)); }
    proc(ch,scope);
  }
}
const tpl=document.getElementById('tpl'); const root=document.getElementById('root'); root.innerHTML=tpl.innerHTML;
const comp=new Component(window.__props||{}); proc(root,comp.renderVals()||{});
</script>
</body>
</html>
