<body>
<div id="root"></div>
<template id="tpl">

<div dir="rtl" style="width: 390px; height: 844px; background: radial-gradient(80% 45% at 50% 38%, #8E2A6E 0%, #3E1670 50%, #150A2E 100%); display: flex; flex-direction: column; align-items: center; overflow: hidden; position: relative; font-family: 'Cairo', sans-serif; color: #FFFFFF; padding: 24px 24px 34px">
  <div aria-hidden="true" style="position: absolute; top: 170px; left: 50%; margin-left: -170px; width: 340px; height: 340px; border-radius: 50%; border: 2px dashed rgba(255,194,75,0.35)"></div>
  <div aria-hidden="true" style="position: absolute; top: 210px; left: 50%; margin-left: -130px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, rgba(242,86,154,0.45), transparent 70%)"></div>

  <span style="font-size: 14px; font-weight: 800; padding: 6px 16px; border-radius: 999px; background: rgba(255,255,255,0.1); position: relative">الجولة 3 من 10 · فريق البرتقان</span>

  <h1 style="margin: 34px 0 0; font-size: 22px; font-weight: 800; color: #FFE3D2; position: relative">سلّم الموبايل لـ</h1>

  <img src="../../assets/av-mena.png" alt="" style="width: 170px; height: 170px; border-radius: 50%; object-fit: cover; margin-top: 26px; position: relative; border: 6px solid #FF9E6A; box-shadow: 0 0 0 10px rgba(255,158,106,0.18), 0 0 60px rgba(242,86,154,0.6)">
  <span style="font-size: 48px; font-weight: 900; margin-top: 16px; position: relative; text-shadow: 0 4px 0 #B83A72">منة</span>

  <div style="margin-top: 22px; display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 16px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.12); position: relative">
    <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFC24B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><path d="M3 3l18 18"></path></svg>
    <span style="font-size: 14px; font-weight: 700; color: #EADFFF">باقي اللاعبين ما يبصّوش على الشاشة!</span>

  <div style="flex: 1"></div>
  <a href="Play.dc.html" style="width: 100%; text-decoration: none; height: 66px; border-radius: 999px; background: linear-gradient(90deg, #FFB25E 0%, #FF8A4C 45%, #F2569A 100%); border-bottom: 5px solid #B83A72; color: #2A0E35; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 22px; font-weight: 900; box-shadow: inset 0 2px 0 rgba(255,255,255,0.55), 0 12px 30px rgba(242,86,154,0.45)">
    <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5a1.5 1.5 0 0 1 3 0v5M12 10V4a1.5 1.5 0 0 1 3 0v6M15 10V6a1.5 1.5 0 0 1 3 0v7a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-3l-2.5-4a1.5 1.5 0 0 1 2.5-1.7L9 13"></path></svg>
    أنا منة، اكشف الكارت

</template>
<script>window.__props={};
class DCLogic{constructor(p){this.props=p||{};this.state={};}setState(s){Object.assign(this.state,typeof s==='function'?s(this.state):s);}forceUpdate(){}}

class Component extends DCLogic {
renderVals() {
return {};
}
}


function look(scope,p){p=p.trim(); if(p==='true')return true; if(p==='false')return false; if(/^-?\d+(\.\d+)?$/.test(p))return +p; return p.split('.').reduce((o,k)=>o==null?undefined:o[k],scope);}
function sub(str,scope){return str.replace(/\{\{\s*([^}]+?)\s*\}\}/g,(m,p)=>{const v=look(scope,p);return v==null?'':String(v);});}
function proc(node,scope){
  for(const ch of Array.from(node.childNodes)){
    if(ch.nodeType===3){ if(ch.nodeValue.includes('{{')) ch.nodeValue=sub(ch.nodeValue,scope); continue; }
    if(ch.nodeType!==1) continue;
    const tag=ch.tagName.toLowerCase();
    if(tag==='sc-for'){ const m=(ch.getAttribute('list')||'').match(/\{\{\s*([^}]+?)\s*\}\}/); const list=m?look(scope,m[1])||[]:[]; const as=ch.getAttribute('as')||'item';
      list.forEach((it,i)=>{ const frag=document.createElement('div'); frag.innerHTML=ch.innerHTML; const s=Object.assign({},scope,{[as]:it,$index:i}); proc(frag,s); while(frag.firstChild) ch.parentNode.insertBefore(frag.firstChild,ch); });
      ch.remove(); continue; }
    if(tag==='sc-if'){ const m=(ch.getAttribute('value')||'').match(/\{\{\s*([^}]+?)\s*\}\}/); const v=m?look(scope,m[1]):false; if(v){ proc(ch,scope); while(ch.firstChild) ch.parentNode.insertBefore(ch.firstChild,ch);} ch.remove(); continue; }
    for(const a of Array.from(ch.attributes)){ if(/^on[A-Z]/.test(a.name)||/^on/.test(a.name)&&a.value.includes('{{')){ch.removeAttribute(a.name);continue;} if(a.value.includes('{{')) ch.setAttribute(a.name,sub(a.value,scope)); }
    proc(ch,scope);
  }
}
const tpl=document.getElementById('tpl'); const root=document.getElementById('root'); root.innerHTML=tpl.innerHTML;
const comp=new Component(window.__props||{}); proc(root,comp.renderVals()||{});
</script>
