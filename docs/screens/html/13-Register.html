<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لعبة الجماعة — إنشاء الملف</title>
<link rel="stylesheet" href="../../fonts/fonts.css">


<style>
body{margin:0;font-family:'Cairo',sans-serif;color:#FFFFFF}
*{box-sizing:border-box}
button,input{font-family:inherit}
input::placeholder{color:#A99BC8}
a{color:#FFD27A}a:hover{color:#FFFFFF}
</style>

<style>html,body{background:#0B0618}</style>
</head>
<body>
<div id="root"></div>
<template id="tpl">

<div dir="rtl" style="width: 390px; height: 844px; background: radial-gradient(90% 45% at 50% 18%, #4E2590 0%, #2A1458 50%, #170B30 100%); display: flex; flex-direction: column; overflow: hidden; position: relative; font-family: 'Cairo', sans-serif; color: #FFFFFF; padding: 20px 24px 34px">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Otp.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
    <span style="font-size: 14px; font-weight: 700; color: #D9CCF2">خطوة أخيرة</span>
    <span style="width: 44px"></span>
  </div>

  <h1 style="margin: 4px 0 0; font-size: 28px; font-weight: 900; text-align: center">اعمل شخصيتك</h1>

  <div style="align-self: center; position: relative; margin-top: 18px">
    <img src="{{current}}" alt="الصورة المختارة" style="width: 132px; height: 132px; border-radius: 50%; object-fit: cover; border: 4px solid #FFC24B; box-shadow: 0 0 0 6px rgba(255,194,75,0.18), 0 0 40px rgba(255,194,75,0.4)">
    <svg aria-hidden="true" width="48" height="34" viewBox="0 0 78 56" style="position: absolute; top: -26px; left: 42px; transform: rotate(-8deg)"><path d="M6 18l16 14L39 4l17 28 16-14-8 32H14z" fill="#FFC24B" stroke="#C98A12" stroke-width="3" stroke-linejoin="round"></path></svg>
  </div>

  <div role="radiogroup" aria-label="اختار صورتك" style="display: flex; justify-content: center; gap: 10px; margin-top: 18px">
    <sc-for list="{{avatars}}" as="a" hint-placeholder-count="5">
      <button role="radio" aria-checked="{{a.checked}}" aria-label="{{a.label}}" onClick="{{a.pick}}" style="{{a.style}}">
        <img src="{{a.src}}" alt="" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover">
      </button>
    </sc-for>
  </div>

  <label for="nick" style="font-size: 14px; font-weight: 700; color: #EADFFF; margin: 26px 0 8px">اسمك في اللعب</label>
  <input id="nick" value="أسامة" style="height: 58px; padding: 0 16px; border-radius: 16px; border: 2px solid #B98AFF; background: rgba(0,0,0,0.25); color: #FFFFFF; font-size: 18px; font-weight: 800; outline: none">

  <span style="font-size: 14px; font-weight: 700; color: #EADFFF; margin: 20px 0 8px">لهجة المحتوى المفضلة</span>
  <div role="group" aria-label="لهجة المحتوى" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <button aria-pressed="true" style="height: 48px; border-radius: 14px; border: 2px solid #B98AFF; background: linear-gradient(180deg, #8F4BF0, #6A24C9); color: #FFFFFF; font-size: 15px; font-weight: 800">مصري</button>
    <button aria-pressed="false" style="height: 48px; border-radius: 14px; border: 1.5px solid rgba(163,91,255,0.4); background: rgba(0,0,0,0.2); color: #EADFFF; font-size: 15px; font-weight: 700">خليجي</button>
    <button aria-pressed="false" style="height: 48px; border-radius: 14px; border: 1.5px solid rgba(163,91,255,0.4); background: rgba(0,0,0,0.2); color: #EADFFF; font-size: 15px; font-weight: 700">عربي عام</button>
  </div>

  <div style="flex: 1"></div>
  <a href="Home.dc.html" style="text-decoration: none; height: 62px; border-radius: 999px; background: linear-gradient(90deg, #FFB25E 0%, #FF8A4C 45%, #F2569A 100%); border-bottom: 5px solid #B83A72; color: #2A0E35; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; box-shadow: inset 0 2px 0 rgba(255,255,255,0.55), 0 12px 30px rgba(242,86,154,0.45)">يلا نلعب</a>
</div>
</template>
<script>window.__props={};
class DCLogic{constructor(p){this.props=p||{};this.state={};}setState(s){Object.assign(this.state,typeof s==='function'?s(this.state):s);}forceUpdate(){}}

class Component extends DCLogic {
constructor(p) { super(p); this.state = { picked: 1 }; }
renderVals() {
const list = [
['../../assets/av-sara.png','شخصية 1'],
['../../assets/av-karim.png','شخصية 2'],
['../../assets/av-ahmed.png','شخصية 3'],
['../../assets/av-mena.png','شخصية 4'],
['../../assets/av-mahmoud.png','شخصية 5']
];
const p = this.state.picked;
return {
current: list[p][0],
avatars: list.map((a, i) => ({
src: a[0], label: a[1], checked: i === p ? 'true' : 'false',
pick: () => this.setState({ picked: i }),
style: 'width: 56px; height: 56px; padding: 0; border-radius: 50%; cursor: pointer; background: transparent; ' + (i === p ? 'border: 3px solid #FFC24B; box-shadow: 0 0 16px rgba(255,194,75,0.5)' : 'border: 3px solid rgba(163,91,255,0.4); opacity: 0.8')
}))
};
}
}


function look(scope,p){p=p.trim(); if(p==='true')return true; if(p==='false')return false; if(/^-?\d+(\.\d+)?$/.test(p))return +p; return p.split('.').reduce((o,k)=>o==null?undefined:o[k],scope);}
function sub(str,scope){return str.replace(/\{\{\s*([^}]+?)\s*\}\}/g,(m,p)=>{const v=look(scope,p);return v==null?'':String(v);});}
function proc(node,scope){
  for(const ch of Array.from(node.childNodes)){
    if(ch.nodeType===3){ if(ch.nodeValue.includes('{{')) ch.nodeValue=sub(ch.nodeValue,scope); continue; }
    if(ch.nodeType!==1) continue;
    const tag=ch.tagName.toLowerCase();
    if(tag==='sc-for'){ const m=(ch.getAttribute('list')||'').match(/\{\{\s*([^}]+?)\s*\}\}/); const list=m?look(scope,m[1])||[]:[]; const as=ch.getAttribute('as')||'item';
      list.forEach((it,i)=>{ const frag=document.createElement('div'); frag.innerHTML=ch.innerHTML; const s=Object.assign({},scope,{[as]:it,$index:i}); proc(frag,s); while(frag.firstChild) ch.parentNode.insertBefore(frag.firstChild,ch); });
      ch.remove(); continue; }
    if(tag==='sc-if'){ const m=(ch.getAttribute('value')||'').match(/\{\{\s*([^}]+?)\s*\}\}/); const v=m?look(scope,m[1]):false; if(v){ proc(ch,scope); while(ch.firstChild) ch.parentNode.insertBefore(ch.firstChild,ch);} ch.remove(); continue; }
    for(const a of Array.from(ch.attributes)){ if(/^on[A-Z]/.test(a.name)||/^on/.test(a.name)&&a.value.includes('{{')){ch.removeAttribute(a.name);continue;} if(a.value.includes('{{')) ch.setAttribute(a.name,sub(a.value,scope)); }
    proc(ch,scope);
  }
}
const tpl=document.getElementById('tpl'); const root=document.getElementById('root'); root.innerHTML=tpl.innerHTML;
const comp=new Component(window.__props||{}); proc(root,comp.renderVals()||{});
</script>
</body>
</html>
