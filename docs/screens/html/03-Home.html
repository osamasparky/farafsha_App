<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لعبة الجماعة — الرئيسية</title>
<link rel="stylesheet" href="../../fonts/fonts.css">


<style>
body{margin:0;font-family:'Cairo',sans-serif;color:#FFFFFF}
*{box-sizing:border-box}
button,input{font-family:inherit}
a{color:#FFD27A}a:hover{color:#FFFFFF}
</style>

<style>html,body{background:#0B0618}</style>
</head>
<body>
<div id="root"></div>
<template id="tpl">

<div dir="rtl" style="width: 390px; height: 844px; background: radial-gradient(100% 40% at 50% 0%, #3E1D7A 0%, #1E0F40 60%, #150A2E 100%); display: flex; flex-direction: column; overflow: hidden; font-family: 'Cairo', sans-serif; color: #FFFFFF">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 12px">
    <div style="display: flex; align-items: center; gap: 10px">
      <img src="../../assets/av-ahmed.png" alt="" style="width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2.5px solid #FFC24B; box-shadow: 0 0 14px rgba(255,194,75,0.45)">
      <div style="display: flex; flex-direction: column; line-height: 1.25">
        <span style="font-size: 13px; color: #CFC6E4">مساء الخير</span>
        <span style="font-size: 19px; font-weight: 900">أهلاً يا أسامة</span>
      </div>
    </div>
    <button aria-label="الإشعارات، فيه جديد" style="width: 46px; height: 46px; border-radius: 14px; border: 1px solid rgba(163,91,255,0.35); background: rgba(255,255,255,0.06); color: #FFFFFF; display: flex; align-items: center; justify-content: center; position: relative">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"></path><path d="M10.3 20a2 2 0 0 0 3.4 0"></path></svg>
      <span style="position: absolute; top: 9px; left: 10px; width: 10px; height: 10px; border-radius: 50%; background: #F2569A; border: 2px solid #2A1656"></span>
    </button>
  </header>

  <div role="tablist" aria-label="الأقسام" style="margin: 0 20px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: rgba(0,0,0,0.25); border: 1px solid rgba(163,91,255,0.3)">
    <button role="tab" aria-selected="true" style="height: 42px; border-radius: 999px; border: none; background: linear-gradient(180deg, #A35BFF, #7A2FE0); color: #FFFFFF; font-size: 15px; font-weight: 800; box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 0 18px rgba(163,91,255,0.6)">الألعاب</button>
    <button role="tab" aria-selected="false" style="height: 42px; border-radius: 999px; border: none; background: transparent; color: #CFC6E4; font-size: 15px; font-weight: 700">التحديات</button>
    <button role="tab" aria-selected="false" style="height: 42px; border-radius: 999px; border: none; background: transparent; color: #CFC6E4; font-size: 15px; font-weight: 700">المفضلة</button>
  </div>

  <div style="flex: 1; padding: 16px 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 134px; gap: 12px; min-height: 0">
    <sc-for list="{{games}}" as="g" hint-placeholder-count="8">
      <a href="Game.dc.html" style="{{g.cardStyle}}">
        <img src="{{g.img}}" alt="" style="width: 74px; height: 66px; object-fit: contain; -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%); mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%); filter: drop-shadow(0 6px 8px rgba(0,0,0,0.35))">
        <span style="font-size: 17px; font-weight: 900; line-height: 1.2; text-shadow: 0 2px 4px rgba(0,0,0,0.35)">{{g.name}}</span>
        <span style="font-size: 11px; color: rgba(255,255,255,0.88); line-height: 1.3">{{g.sub}}</span>
      </a>
    </sc-for>
  </div>

  <nav aria-label="التنقل الرئيسي" style="height: 86px; background: linear-gradient(180deg, #1F1042, #130828); border-top: 1px solid rgba(163,91,255,0.3); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 0 6px 10px">
    <a href="Home.dc.html" style="text-decoration: none; color: #CFC6E4; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 700">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>الرئيسية</a>
    <a href="Room.dc.html" style="text-decoration: none; color: #CFC6E4; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 700">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18.5 14.8c1.6.8 2.7 2.6 3 5.2"></path></svg>الأصدقاء</a>
    <a href="Home.dc.html" aria-current="page" style="text-decoration: none; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 900; margin-top: -26px">
      <span style="width: 60px; height: 60px; border-radius: 20px; background: linear-gradient(160deg, #B98AFF, #6A24C9); border: 3px solid #150A2E; border-bottom: 5px solid #4A1690; box-shadow: inset 0 2px 0 rgba(255,255,255,0.45), 0 0 24px rgba(163,91,255,0.7); display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M7 7h10a5 5 0 0 1 5 5v3a3.2 3.2 0 0 1-5.8 1.9L14.6 15H9.4l-1.6 1.9A3.2 3.2 0 0 1 2 15v-3a5 5 0 0 1 5-5zm0 3.2v1.3H5.7v1.6H7v1.3h1.6v-1.3h1.3v-1.6H8.6v-1.3zM16 10.6a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm2 2a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"></path></svg>
      </span>الألعاب</a>
    <a href="Leaderboard.dc.html" style="text-decoration: none; color: #CFC6E4; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 700">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4"></path><path d="M7 4h10v5a5 5 0 0 1-10 0z"></path><path d="M17 5h3a3 3 0 0 1-3 4M7 5H4a3 3 0 0 0 3 4"></path></svg>الترتيب</a>
    <a href="Home.dc.html" style="text-decoration: none; color: #CFC6E4; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 700">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="6" r="2"></circle><circle cx="18" cy="6" r="2"></circle><circle cx="6" cy="18" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>الكل</a>
  </nav>
</div>
</template>
<script>window.__props={};
class DCLogic{constructor(p){this.props=p||{};this.state={};}setState(s){Object.assign(this.state,typeof s==='function'?s(this.state):s);}forceUpdate(){}}

class Component extends DCLogic {
renderVals() {
const base = 'text-decoration: none; color: #FFFFFF; border-radius: 22px; padding: 10px 10px 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; border: 1.5px solid rgba(255,255,255,0.18); box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), inset 0 -10px 20px rgba(0,0,0,0.18), 0 8px 18px rgba(0,0,0,0.35); background: ';
const g = [
['أمثال شعبية','كمّل المثل الشعبي','linear-gradient(160deg,#D2566A,#8E2A4E)','../../assets/ic-quote.png'],
['جمل مشهورة','من الأفلام والمسلسلات','linear-gradient(160deg,#8F3BD0,#561C94)','../../assets/ic-film.png'],
['خمن الكلمة','ممنوع تقول','linear-gradient(160deg,#4846BE,#2B2580)','../../assets/ic-a.png'],
['معلومات عامة','سؤال على السريع','linear-gradient(160deg,#2F6E7A,#1B3F52)','../../assets/ic-bulb.png'],
['خمن الأغنية','من التلميحات','linear-gradient(160deg,#B23A72,#6E1C4E)','../../assets/ic-music.png'],
['خمن الصورة','ارسم وخمّن','linear-gradient(160deg,#4740B0,#28226E)','../../assets/ic-photo.png'],
['مين أنا؟','شخصيات وأشياء','linear-gradient(160deg,#7A6A3A,#3F3420)','../../assets/ic-mask.png'],
['تحديات عشوائية','مفاجآت كل جولة','linear-gradient(160deg,#8C3468,#531B44)','../../assets/ic-dice.png']
];
return { games: g.map(x => ({ name: x[0], sub: x[1], cardStyle: base + x[2], img: x[3] })) };
}
}


function look(scope,p){p=p.trim(); if(p==='true')return true; if(p==='false')return false; if(/^-?\d+(\.\d+)?$/.test(p))return +p; return p.split('.').reduce((o,k)=>o==null?undefined:o[k],scope);}
function sub(str,scope){return str.replace(/\{\{\s*([^}]+?)\s*\}\}/g,(m,p)=>{const v=look(scope,p);return v==null?'':String(v);});}
function proc(node,scope){
  for(const ch of Array.from(node.childNodes)){
    if(ch.nodeType===3){ if(ch.nodeValue.includes('{{')) ch.nodeValue=sub(ch.nodeValue,scope); continue; }
    if(ch.nodeType!==1) continue;
    const tag=ch.tagName.toLowerCase();
    if(tag==='sc-for'){ const m=(ch.getAttribute('list')||'').match(/\{\{\s*([^}]+?)\s*\}\}/); const list=m?look(scope,m[1])||[]:[]; const as=ch.getAttribute('as')||'item';
      list.forEach((it,i)=>{ const frag=document.createElement('div'); frag.innerHTML=ch.innerHTML; const s=Object.assign({},scope,{[as]:it,$index:i}); proc(frag,s); while(frag.firstChild) ch.parentNode.insertBefore(frag.firstChild,ch); });
      ch.remove(); continue; }
    if(tag==='sc-if'){ const m=(ch.getAttribute('value')||'').match(/\{\{\s*([^}]+?)\s*\}\}/); const v=m?look(scope,m[1]):false; if(v){ proc(ch,scope); while(ch.firstChild) ch.parentNode.insertBefore(ch.firstChild,ch);} ch.remove(); continue; }
    for(const a of Array.from(ch.attributes)){ if(/^on[A-Z]/.test(a.name)||/^on/.test(a.name)&&a.value.includes('{{')){ch.removeAttribute(a.name);continue;} if(a.value.includes('{{')) ch.setAttribute(a.name,sub(a.value,scope)); }
    proc(ch,scope);
  }
}
const tpl=document.getElementById('tpl'); const root=document.getElementById('root'); root.innerHTML=tpl.innerHTML;
const comp=new Component(window.__props||{}); proc(root,comp.renderVals()||{});
</script>
</body>
</html>
