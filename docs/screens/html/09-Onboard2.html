<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="../../fonts/fonts.css">


<style>
body{margin:0;font-family:'Cairo',sans-serif;color:#FFFFFF}
*{box-sizing:border-box}
button,input{font-family:inherit}
a{color:#FFD27A}a:hover{color:#FFFFFF}
</style>

<style>html,body{background:#0B0618}</style>
</head>
<body>
<div id="root"></div>
<template id="tpl">

<div dir="rtl" style="width: 390px; height: 844px; background: radial-gradient(90% 55% at 50% 32%, #4E2590 0%, #2A1458 50%, #170B30 100%); display: flex; flex-direction: column; align-items: center; overflow: hidden; position: relative; font-family: 'Cairo', sans-serif; color: #FFFFFF; padding: 20px 24px 34px">
  <div aria-hidden="true" style="position: absolute; top: 160px; left: 40px; width: 140px; height: 140px; border-radius: 50%; background: #4FC3F7; filter: blur(60px); opacity: 0.35"></div>
  <div aria-hidden="true" style="position: absolute; top: 260px; right: 30px; width: 140px; height: 140px; border-radius: 50%; background: #F2569A; filter: blur(60px); opacity: 0.35"></div>

  <div style="width: 100%; display: flex; justify-content: flex-start; position: relative">
    <a href="Login.dc.html" style="text-decoration: none; height: 44px; padding: 0 16px; border-radius: 999px; background: rgba(255,255,255,0.08); color: #EADFFF; display: flex; align-items: center; font-size: 15px; font-weight: 700">تخطي</a>
  </div>

  <img src="../../assets/online.png" alt="" style="width: 330px; height: 300px; object-fit: cover; margin-top: 40px; position: relative; -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%); mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%); filter: drop-shadow(0 0 30px rgba(163,91,255,0.5))">

  <div style="display: flex; margin-top: -10px; position: relative">
    <img src="../../assets/av-sara.png" alt="" style="width: 52px; height: 52px; border-radius: 50%; object-fit: cover; border: 3px solid #2A1458">
    <img src="../../assets/av-ahmed.png" alt="" style="width: 52px; height: 52px; border-radius: 50%; object-fit: cover; border: 3px solid #2A1458; margin-right: -14px">
    <img src="../../assets/av-mena.png" alt="" style="width: 52px; height: 52px; border-radius: 50%; object-fit: cover; border: 3px solid #2A1458; margin-right: -14px">
    <span style="width: 52px; height: 52px; border-radius: 50%; background: #A35BFF; border: 3px solid #2A1458; margin-right: -14px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 900">+8</span>
  </div>

  <h1 style="margin: 28px 0 0; font-size: 30px; font-weight: 900; text-align: center; position: relative; text-shadow: 0 3px 0 #6A24C9">العب أونلاين مع صحابك</h1>
  <p style="margin: 10px 0 0; font-size: 16px; color: #E4D9FA; text-align: center; line-height: 1.7; position: relative">اعمل غرفة، شارك الرمز، ويدخلوا معاك<br>من أي مكان، لحد 12 لاعب.</p>

  <div style="flex: 1"></div>
  <div aria-hidden="true" style="display: flex; gap: 6px; margin-bottom: 18px">
    <span style="width: 8px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.35)"></span>
    <span style="width: 24px; height: 8px; border-radius: 4px; background: #FFFFFF"></span>
    <span style="width: 8px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.35)"></span>
  </div>
  <a href="Onboard3.dc.html" style="width: 100%; text-decoration: none; height: 62px; border-radius: 999px; background: linear-gradient(90deg, #FFB25E 0%, #FF8A4C 45%, #F2569A 100%); border-bottom: 5px solid #B83A72; color: #2A0E35; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; box-shadow: inset 0 2px 0 rgba(255,255,255,0.55), 0 12px 30px rgba(242,86,154,0.45)">التالي</a>
</div>
</template>
<script>window.__props={};
class DCLogic{constructor(p){this.props=p||{};this.state={};}setState(s){Object.assign(this.state,typeof s==='function'?s(this.state):s);}forceUpdate(){}}

class Component extends DCLogic {
renderVals() {
return {};
}
}


function look(scope,p){p=p.trim(); if(p==='true')return true; if(p==='false')return false; if(/^-?\d+(\.\d+)?$/.test(p))return +p; return p.split('.').reduce((o,k)=>o==null?undefined:o[k],scope);}
function sub(str,scope){return str.replace(/\{\{\s*([^}]+?)\s*\}\}/g,(m,p)=>{const v=look(scope,p);return v==null?'':String(v);});}
function proc(node,scope){
  for(const ch of Array.from(node.childNodes)){
    if(ch.nodeType===3){ if(ch.nodeValue.includes('{{')) ch.nodeValue=sub(ch.nodeValue,scope); continue; }
    if(ch.nodeType!==1) continue;
    const tag=ch.tagName.toLowerCase();
    if(tag==='sc-for'){ const m=(ch.getAttribute('list')||'').match(/\{\{\s*([^}]+?)\s*\}\}/); const list=m?look(scope,m[1])||[]:[]; const as=ch.getAttribute('as')||'item';
      list.forEach((it,i)=>{ const frag=document.createElement('div'); frag.innerHTML=ch.innerHTML; const s=Object.assign({},scope,{[as]:it,$index:i}); proc(frag,s); while(frag.firstChild) ch.parentNode.insertBefore(frag.firstChild,ch); });
      ch.remove(); continue; }
    if(tag==='sc-if'){ const m=(ch.getAttribute('value')||'').match(/\{\{\s*([^}]+?)\s*\}\}/); const v=m?look(scope,m[1]):false; if(v){ proc(ch,scope); while(ch.firstChild) ch.parentNode.insertBefore(ch.firstChild,ch);} ch.remove(); continue; }
    for(const a of Array.from(ch.attributes)){ if(/^on[A-Z]/.test(a.name)||/^on/.test(a.name)&&a.value.includes('{{')){ch.removeAttribute(a.name);continue;} if(a.value.includes('{{')) ch.setAttribute(a.name,sub(a.value,scope)); }
    proc(ch,scope);
  }
}
const tpl=document.getElementById('tpl'); const root=document.getElementById('root'); root.innerHTML=tpl.innerHTML;
const comp=new Component(window.__props||{}); proc(root,comp.renderVals()||{});
</script>
</body>
</html>
