<!doctype html>

<style>
body{margin:0;font-family:'Cairo',sans-serif;color:#FFFFFF}
*{box-sizing:border-box}
button,input{font-family:inherit}
a{color:#FFD27A}a:hover{color:#FFFFFF}
</style>

<style>html,body{background:#0B0618}</style>
</head>
<body>
<div id="root"></div>
<template id="tpl">

<div dir="rtl" style="width: 390px; height: 844px; background: radial-gradient(90% 55% at 50% 30%, #5A2A9E 0%, #2E1660 50%, #170B30 100%); display: flex; flex-direction: column; align-items: center; overflow: hidden; position: relative; font-family: 'Cairo', sans-serif; color: #FFFFFF">

  <div aria-hidden="true" style="position: absolute; top: 300px; left: 30px; width: 70px; height: 70px; border-radius: 50%; background: #FFB04A; filter: blur(28px); opacity: 0.45"></div>
  <div aria-hidden="true" style="position: absolute; top: 340px; right: 20px; width: 90px; height: 90px; border-radius: 50%; background: #FF7AC0; filter: blur(34px); opacity: 0.35"></div>
  <div aria-hidden="true" style="position: absolute; top: 40px; right: 60px; width: 120px; height: 120px; border-radius: 50%; background: #A35BFF; filter: blur(50px); opacity: 0.5"></div>

  <div role="img" aria-label="لمّة" style="position: relative; margin-top: 44px; width: 300px; display: flex; flex-direction: column; align-items: center">
    <span aria-hidden="true" style="position: absolute; top: 40px; right: 18px; width: 10px; height: 24px; border-radius: 3px; background: #F2569A; transform: rotate(30deg)"></span>
    <span aria-hidden="true" style="position: absolute; top: 120px; right: 4px; width: 14px; height: 14px; background: #FFC24B; transform: rotate(45deg)"></span>
    <span aria-hidden="true" style="position: absolute; top: 30px; left: 22px; width: 12px; height: 12px; background: #FF8A4C; transform: rotate(45deg)"></span>
    <span aria-hidden="true" style="position: absolute; top: 140px; left: 6px; width: 8px; height: 22px; border-radius: 3px; background: #B98AFF; transform: rotate(-25deg)"></span>
    <svg aria-hidden="true" width="92" height="66" viewBox="0 0 78 56" style="position: relative; z-index: 1; margin-bottom: -30px; margin-left: 70px; transform: rotate(-12deg); filter: drop-shadow(0 4px 6px rgba(0,0,0,0.45))"><path d="M6 18l16 14L39 4l17 28 16-14-8 32H14z" fill="#FFC24B" stroke="#C98A12" stroke-width="3" stroke-linejoin="round"></path><circle cx="6" cy="16" r="5" fill="#FFC24B"></circle><circle cx="39" cy="5" r="5" fill="#FFC24B"></circle><circle cx="72" cy="16" r="5" fill="#FFC24B"></circle></svg>
    <span aria-hidden="true" style="font-size: 128px; font-weight: 900; line-height: 1.2; color: #FFFFFF; text-shadow: 4px 0 0 #F2569A, -4px 0 0 #F2569A, 0 4px 0 #F2569A, 0 -4px 0 #F2569A, 3px 3px 0 #F2569A, -3px 3px 0 #F2569A, 0 10px 0 #6A24C9, 0 16px 0 #3E1585, 0 26px 34px rgba(0,0,0,0.5)">لمّة</span>
  </div>

  <p style="margin: 4px 24px 0; font-size: 17px; font-weight: 600; color: #EADFFF; text-align: center; line-height: 1.6; position: relative">مجموعة ألعاب جماعية للمتعة والتحدي<br>مع الأصدقاء والعائلة</p>

  <img src="../../assets/crowd.png" alt="مجموعة أصدقاء بيضحكوا وهم بيلعبوا على الموبايل" style="width: 430px; height: auto; margin-top: 8px; position: relative; -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 14%, #000 72%, transparent 100%); mask-image: linear-gradient(180deg, transparent 0%, #000 14%, #000 72%, transparent 100%)">

  <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 0 24px 34px; display: flex; flex-direction: column; align-items: center; gap: 14px; background: linear-gradient(180deg, transparent, #170B30 40%)">
    <div aria-hidden="true" style="display: flex; gap: 6px; padding-top: 30px">
      <span style="width: 24px; height: 8px; border-radius: 4px; background: #FFFFFF"></span>
      <span style="width: 8px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.35)"></span>
      <span style="width: 8px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.35)"></span>
    </div>

      ابدأ الآن
      <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.35); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17 4.5v15L5 12z"></path></svg></span>
    </a>
    <p style="margin: 0; font-size: 15px; color: #E4D9FA">لديك حساب؟ <a href="Home.dc.html" style="font-weight: 800">تسجيل الدخول</a></p>
  </div>
</div>
</template>
<script>window.__props={};
class DCLogic{constructor(p){this.props=p||{};this.state={};}setState(s){Object.assign(this.state,typeof s==='function'?s(this.state):s);}forceUpdate(){}}

class Component extends DCLogic {
renderVals() {
return {};
}
}


function look(scope,p){p=p.trim(); if(p==='true')return true; if(p==='false')return false; if(/^-?\d+(\.\d+)?$/.test(p))return +p; return p.split('.').reduce((o,k)=>o==null?undefined:o[k],scope);}
function sub(str,scope){return str.replace(/\{\{\s*([^}]+?)\s*\}\}/g,(m,p)=>{const v=look(scope,p);return v==null?'':String(v);});}
function proc(node,scope){
  for(const ch of Array.from(node.childNodes)){
    if(ch.nodeType===3){ if(ch.nodeValue.includes('{{')) ch.nodeValue=sub(ch.nodeValue,scope); continue; }
    if(ch.nodeType!==1) continue;
    const tag=ch.tagName.toLowerCase();
    if(tag==='sc-for'){ const m=(ch.getAttribute('list')||'').match(/\{\{\s*([^}]+?)\s*\}\}/); const list=m?look(scope,m[1])||[]:[]; const as=ch.getAttribute('as')||'item';
      list.forEach((it,i)=>{ const frag=document.createElement('div'); frag.innerHTML=ch.innerHTML; const s=Object.assign({},scope,{[as]:it,$index:i}); proc(frag,s); while(frag.firstChild) ch.parentNode.insertBefore(frag.firstChild,ch); });
      ch.remove(); continue; }
    if(tag==='sc-if'){ const m=(ch.getAttribute('value')||'').match(/\{\{\s*([^}]+?)\s*\}\}/); const v=m?look(scope,m[1]):false; if(v){ proc(ch,scope); while(ch.firstChild) ch.parentNode.insertBefore(ch.firstChild,ch);} ch.remove(); continue; }
    for(const a of Array.from(ch.attributes)){ if(/^on[A-Z]/.test(a.name)||/^on/.test(a.name)&&a.value.includes('{{')){ch.removeAttribute(a.name);continue;} if(a.value.includes('{{')) ch.setAttribute(a.name,sub(a.value,scope)); }
    proc(ch,scope);
  }
}
const tpl=document.getElementById('tpl'); const root=document.getElementById('root'); root.innerHTML=tpl.innerHTML;
const comp=new Component(window.__props||{}); proc(root,comp.renderVals()||{});
</script>
</body>
</html>
