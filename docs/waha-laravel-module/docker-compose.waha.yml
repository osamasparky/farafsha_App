services:
  waha:
    image: ${WAHA_IMAGE:-devlikeapro/waha:latest}
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:?Set WAHA_API_KEY}
      WAHA_PRINT_QR: ${WAHA_PRINT_QR:-False}
      WAHA_DASHBOARD_ENABLED: ${WAHA_DASHBOARD_ENABLED:-False}
      WHATSAPP_SWAGGER_ENABLED: ${WHATSAPP_SWAGGER_ENABLED:-False}
      WHATSAPP_DEFAULT_ENGINE: ${WHATSAPP_DEFAULT_ENGINE:-WEBJS}
      WAHA_LOG_LEVEL: ${WAHA_LOG_LEVEL:-info}
    volumes:
      - waha_sessions:/app/.sessions
      - waha_media:/app/.media
    networks:
      - waha_internal
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/sessions').then(r=>process.exit(r.ok||r.status===401?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

volumes:
  waha_sessions:
  waha_media:

networks:
  waha_internal:
    name: waha_internal
    # Default bridge network: private service-to-service reachability, no published WAHA port,
    # while WAHA retains outbound access to WhatsApp. Do not set internal: true here.
