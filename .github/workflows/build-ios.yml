name: Build iOS Release

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

# إلغاء أي بيلد قديم قيد الانتظار تلقائياً عند دفع كود جديد
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS (Flutter)
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: 1. Checkout Code Repository
        uses: actions/checkout@v4

      - name: 1.1 Select Latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Selecting newest Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: 2. Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: 4. Install Flutter Dependencies & iOS Pods
        run: |
          cd mobile
          flutter pub get
          cd ios
          rm -f Podfile.lock
          pod install --repo-update
          cd ../..

      - name: 5. Build iOS Application (Release)
        run: |
          cd mobile
          flutter build ios --release --no-codesign

      - name: 6. Compress iOS App Payload (IPA)
        run: |
          cd mobile/build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r Farafsha-iOS-Release.ipa Payload
          zip -r Runner-App.zip Runner.app

      - name: 7. Upload iOS IPA & App Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: farafsha-ios-release
          path: |
            mobile/build/ios/iphoneos/Farafsha-iOS-Release.ipa
            mobile/build/ios/iphoneos/Runner-App.zip
          retention-days: 14
