name: Build Android Release (AAB & APK)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android AAB & APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v7

      - name: 2. Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: 4. Install Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: 5. Build Android App Bundle (AAB)
        run: |
          cd mobile
          PUBSPEC_BUILD_NUM=$(grep "^version:" pubspec.yaml | sed 's/.*+//' | tr -d '\r\n ')
          RUN_NUM="${{ github.run_number }}"
          if [ -n "$PUBSPEC_BUILD_NUM" ] && [ "$PUBSPEC_BUILD_NUM" -gt "$RUN_NUM" ]; then
            BUILD_NUM="$PUBSPEC_BUILD_NUM"
          else
            BUILD_NUM="$RUN_NUM"
          fi
          echo "Building AAB with build number: $BUILD_NUM"
          flutter build appbundle --release --build-number=$BUILD_NUM

      - name: 6. Build Android APK (Release)
        run: |
          cd mobile
          PUBSPEC_BUILD_NUM=$(grep "^version:" pubspec.yaml | sed 's/.*+//' | tr -d '\r\n ')
          RUN_NUM="${{ github.run_number }}"
          if [ -n "$PUBSPEC_BUILD_NUM" ] && [ "$PUBSPEC_BUILD_NUM" -gt "$RUN_NUM" ]; then
            BUILD_NUM="$PUBSPEC_BUILD_NUM"
          else
            BUILD_NUM="$RUN_NUM"
          fi
          echo "Building APK with build number: $BUILD_NUM"
          flutter build apk --release --build-number=$BUILD_NUM

      - name: 7. Upload AAB Artifact
        uses: actions/upload-artifact@v7
        with:
          name: farafsha-android-release-aab
          path: mobile/build/app/outputs/bundle/release/*.aab
          retention-days: 14

      - name: 8. Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: farafsha-android-release-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
